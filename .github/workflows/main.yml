name: Build Geode Mod

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract mod source
        shell: pwsh
        run: Expand-Archive -LiteralPath predictive-input-buffer-main.zip -DestinationPath source

      - name: Build Windows mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          path: source/predictive-input-buffer-main
          combine: false

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
